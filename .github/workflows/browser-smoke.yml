# Chromium smoke lane: five short user journeys, one existing test each.
# Manual only: the automatic pull_request/push triggers were turned off by the
# owner (2026-09-23). Run it from Actions -> Browser smoke -> Run workflow. The
# full browser suite stays manual (Developer tests -> Run workflow -> browser,
# or explicit selection).
#
# OKF_REQUIRE_BROWSER=1 turns an absent Playwright or Chromium into a
# failure (tests/browser_support.py: unavailable()), never a skip.
name: Browser smoke

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: browser-smoke-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  OKF_REQUIRE_BROWSER: "1"
  PYTHONDONTWRITEBYTECODE: "1"
  PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"

jobs:
  journeys:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements-browser.txt
            requirements-dev.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "22.22.1"
      - id: provision
        name: Provision Playwright and Chromium
        run: |
          python -m pip install -r requirements-browser.txt
          python -m playwright install --with-deps chromium
      # Each journey is its own step so a red step names the journey. Later
      # journeys still run after an earlier failure, but never without a
      # provisioned browser.
      - name: "Journey 1: shell and capability truth"
        if: ${{ !cancelled() && steps.provision.outcome == 'success' }}
        timeout-minutes: 4
        run: python -m pytest -q -p no:cacheprovider "tests/test_ui_shell_browser.py::test_studio_home_preserves_session_review_command_and_authority_capabilities"
      - name: "Journey 2: search to document and Back restores the query"
        if: ${{ !cancelled() && steps.provision.outcome == 'success' }}
        timeout-minutes: 4
        run: python -m pytest -q -p no:cacheprovider "tests/test_section_journey_browser.py::test_serve_section_intent_journey_back_and_open_root"
      - name: "Journey 3: comment, reply, agent mutation and resolution"
        if: ${{ !cancelled() && steps.provision.outcome == 'success' }}
        timeout-minutes: 4
        run: python -m pytest -q -p no:cacheprovider "tests/test_studio_collaboration_real_browser.py::test_page_comment_browser_reply_and_agent_loop"
      - name: "Journey 4: portable feedback import"
        if: ${{ !cancelled() && steps.provision.outcome == 'success' }}
        timeout-minutes: 4
        run: python -m pytest -q -p no:cacheprovider "tests/test_feedback_import_real_browser.py::test_operator_previews_imports_and_the_card_keeps_its_provenance"
      - name: "Journey 5: document patch and outline lifecycle"
        if: ${{ !cancelled() && steps.provision.outcome == 'success' }}
        timeout-minutes: 4
        run: python -m pytest -q -p no:cacheprovider "tests/test_document_outline_browser.py::test_headingless_outline_gains_links_after_real_cli_mutation_without_reload"
