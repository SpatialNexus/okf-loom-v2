name: Developer tests

# Manual only: the automatic pull_request trigger was turned off by the owner
# (2026-09-23). Run it from Actions -> Developer tests -> Run workflow.
on:
  workflow_dispatch:
    inputs:
      browser:
        description: Run the provisioned browser smoke lane (not release evidence)
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: developer-tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONDONTWRITEBYTECODE: "1"
  PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"

jobs:
  core:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "22.22.1"
      - run: python -m pip install -r requirements-dev.txt
      - name: Core (no Playwright installed)
        run: python -m pytest -q -p no:cacheprovider -m "not browser and not integration"
      - name: Conservative built-in YAML
        env:
          OKF_LOOM_FORCE_BUILTIN_YAML: "1"
        run: python -m pytest -q -p no:cacheprovider tests/test_yaml_fallback.py tests/test_bootstrap_import.py
      - run: scripts/okf-loom validate docs-bundle --strict
      - run: git diff --exit-code && git diff --check

  browser-smoke:
    if: github.event_name == 'workflow_dispatch' && inputs.browser
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      OKF_REQUIRE_BROWSER: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22.22.1"
      - run: python -m pip install -r requirements-browser.txt
      - run: python -m playwright install --with-deps chromium
      - name: Document lifecycle and accessibility reflow browser smoke
        run: python -m pytest -q -p no:cacheprovider -m browser tests/test_document_outline_browser.py tests/test_a11y_reflow_browser.py
